<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Styles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 50px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .card {
            width: 250px;
            padding: 25px;
            box-sizing: border-box;
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            line-height: 1.5;
        }

        .card button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Card 1 - Soft */
        .soft {
            background-color: white;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .soft button {
            background-color: #5b7cfa;
            color: white;
        }

        /* Card 2 - Color */
        .color {
            background: linear-gradient(135deg, #ffd6a5, #ffaaa5);
            border-radius: 25px 8px 25px 8px;
        }

        .color button {
            background-color: #7b2cbf;
            color: white;
        }

        /* Card 3 - Border */
        .border {
            background-color: #20243a;
            color: white;
            border: 2px solid #00d9ff;
            border-radius: 8px;
        }

        .border button {
            background-color: transparent;
            color: #00d9ff;
            border: 2px solid #00d9ff;
        }
    </style>
</head>

<body>

    <h1>Card Styles</h1>

    <div class="cards">

        <div class="card soft">
            <h2>Classic</h2>
            <p>
                A clean white card with a soft shadow
                and smooth rounded corners.
            </p>
            <button>Explore</button>
        </div>

        <div class="card color">
            <h2>Colorful</h2>
            <p>
                A colorful gradient card with
                unique rounded corners.
            </p>
            <button>Explore</button>
        </div>

        <div class="card border">
            <h2>Modern</h2>
            <p>
                A dark card with a bright border
                and a simple transparent button.
            </p>
            <button>Explore</button>
        </div>

    </div>

</body>
</html>
