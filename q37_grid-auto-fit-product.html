<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <style>
        /* 1. Base Resets & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* 2. Automatic Reflow Grid Core Logic */
        .product-grid {
            display: grid;
            /* This line automatically handles responsiveness without media queries */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        /* 3. Product Card Styling */
        .product-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Container constraints for image */
        .product-image-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 16px;
            margin-top: auto; /* Pushes price and button to the bottom if text lengths vary */
        }

        .btn-buy {
            display: block;
            text-align: center;
            background-color: #111827;
            color: #ffffff;
            padding: 10px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-buy:hover {
            background-color: #1f2937;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Trending Products</h1>
        
        <div class="product-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9Lb2UwHcq5ZPCiNJQvu0X8kupjXPcLwvwAOOjT8Dmng&s=10" alt="Wireless Headphones">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Wireless Headphones</h2>
                    <p class="product-price">$99.99</p>
                    <a href="#" class="btn-buy">Add to Cart</a>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://m.media-amazon.com/images/I/715EFChDukL.jpg" alt="Smart Watch Pro">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Smart Watch Pro</h2>
                    <p class="product-price">$199.99</p>
                    <a href="#" class="btn-buy">Add to Cart</a>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://m.media-amazon.com/images/I/61P7MvyRbUL._AC_UF1000,1000_QL80_.jpg" alt="Mechanical Keyboard">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Mechanical Keyboard</h2>
                    <p class="product-price">$129.99</p>
                    <a href="#" class="btn-buy">Add to Cart</a>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYntmFMoIYz9TYbaOaanJIOljKUEb2-pUUXG-7RvwQjQIdOxQnMafLvJ_i&s=10" alt="Ergonomic Gaming Mouse">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Ergonomic Gaming Mouse</h2>
                    <p class="product-price">$59.99</p>
                    <a href="#" class="btn-buy">Add to Cart</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
