<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Overflow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        h1 {
            color: #23408e;
        }

        .content {
            width: 100%;
            overflow-x: auto;
        }

        .box {
            min-width: 600px;
            padding: 25px;
            background-color: #dce6ff;
            border: 2px solid #23408e;
            border-radius: 8px;
        }

        p {
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Overflow Fixed Page</h1>

        <div class="content">

            <div class="box">
                <h2>Content Section</h2>

                <p>
                    This page demonstrates how to fix overflow
                    problems using CSS. The content will remain
                    inside the main container instead of breaking
                    the layout.
                </p>

                <p>
                    On smaller screens, horizontal overflow is
                    handled using overflow-x: auto.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
