<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 500px;
            background-color: #e8edff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 60px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 55%;
        }

        .hero-content h1 {
            font-size: 48px;
            color: #203a8f;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 18px;
            line-height: 1.6;
            color: #444;
        }

        .hero-content button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #203a8f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .circle {
            width: 300px;
            height: 300px;
            background-color: #ffb6c1;
            border-radius: 50%;

            position: absolute;
            right: 80px;
            top: 80px;

            z-index: 1;
        }

        .small-circle {
            width: 120px;
            height: 120px;
            background-color: #ffd166;
            border-radius: 50%;

            position: absolute;
            right: 40px;
            bottom: 30px;

            z-index: 3;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="hero-content">
            <h1>Build Something Amazing</h1>

            <p>
                Create beautiful and modern websites
                using HTML and CSS.
            </p>

            <button>Get Started</button>
        </div>

        <div class="circle"></div>

        <div class="small-circle"></div>

    </section>

</body>
</html>
