<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar and Hero</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: #23408e;
            padding: 15px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        /* Hero */
        .hero {
            min-height: 500px;
            padding: 60px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;

            background-color: #eef2ff;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 48px;
            color: #23408e;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .hero-text button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #23408e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
        }

        /* Responsive */
        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-text">

            <h1>Build Your Future</h1>

            <p>
                Create modern and responsive websites
                using HTML and CSS Flexbox.
            </p>

            <button>Get Started</button>

        </div>

        <div class="hero-image">

            <img
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
                alt="Workspace"
            >

        </div>

    </section>

</body>
</html>
