<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Portfolio with Accessible Images – HTML &amp; CSS course assignment">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio with Accessible Images</title>
</head>
<body>
  <header><h1>Anjali Mourya – Portfolio</h1></header>
  <main>
    <section>
      <h2>Profile</h2>
      <!-- Meaningful alt: describes content AND purpose -->
      <img src="https://static.punjabkesari.in/multimedia/15_12_302089307smile-please-2.jpeg" width="150" height="150"
           alt="A smiley with happy face">
    </section>

    <section>
      <h2>Projects</h2>
      <figure>
        <img src="https://images.pexels.com/photos/34803990/pexels-photo-34803990.jpeg?cs=srgb&dl=pexels-dkomov-34803990.jpg&fm=jpg" width="400" height="250"
             alt="Screenshot of the resume website showing a name header and skills list">
        <figcaption>Resume website</figcaption>
      </figure>
      <figure>
        <img src="https://cdn.jotfor.ms/assets/img/templates/og-images/form-templates/registration-form.png" width="400" height="250"
             alt="Screenshot of the student registration form with name, email and course fields">
        <figcaption>Registration form</figcaption>
      </figure>
    </section>

    <section>
      <h2>Decorative image</h2>
      <!-- Purely decorative images get an EMPTY alt so screen readers skip them -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7CBJorho6YGePkRtqPY5gj9l2RwFyfdqGTNlddvpwwLiN5b6RyrkbjMJo&s=10" width="400" height="200" alt="">
    </section>

    <section>
      <h2>Linked image</h2>
      <a href="https://github.com/"><img src="https://dphulk.com/wp-content/uploads/cute-cat-profile-image.webp" width="60" height="60" alt="Visit my GitHub profile"></a>
    </section>
  </main>

  <!--
  ALT TEXT CHECKLIST
  ✔ Describe what the image shows and why it matters.
  ✔ Don't start with "image of…" (screen readers announce it).
  ✔ Linked images: describe the link destination.
  ✔ Decorative images: alt="".
  -->
</body>
</html>
