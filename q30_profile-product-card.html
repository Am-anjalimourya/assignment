<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            width: 300px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-content {
            padding: 20px;
        }

        .product-content h2 {
            margin: 0 0 10px;
            color: #222;
        }

        .product-content p {
            color: #666;
            line-height: 1.5;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #23408e;
            margin: 15px 0;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background-color: #23408e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .buy-btn:hover {
            background-color: #172d6b;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
             alt="Running Shoes">

        <div class="product-content">

            <h2>Running Shoes</h2>

            <p>
                Comfortable and lightweight shoes
                designed for everyday running.
            </p>

            <div class="price">₹1,999</div>

            <button class="buy-btn">
                Buy Now
            </button>

        </div>

    </div>

</body>
</html>
